name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    # Gate the release on the full test matrix (same workflow CI runs on push).
    uses: ./.github/workflows/run-tests.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # The Trusted Publisher on PyPI is scoped to this environment; it also lets you
    # require a manual approval before a release is pushed. Remove both this line and
    # the environment from the PyPI publisher config if you prefer no gate.
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (OIDC); no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
