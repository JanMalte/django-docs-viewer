[project]
name = "django-docs-viewer"
version = "0.2.0"
description = "A simple in-app Markdown documentation viewer for Django."
authors = [{ name = "Malte Gerth", email = "mail@malte-gerth.de" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["django", "documentation", "markdown", "docs"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    "markdown>=3.4",
]

[project.urls]
Homepage = "https://github.com/JanMalte/django-docs-viewer"
Repository = "https://github.com/JanMalte/django-docs-viewer"
Documentation = "https://github.com/JanMalte/django-docs-viewer"

[tool.poetry]
packages = [
    { include = "docs_viewer" },
]

[tool.poetry.group.dev.dependencies]
coverage = ">=7.0"
pre-commit = ">=3.5"
tox = ">=4.0"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501", "UP", "I", "DJ"]

[tool.coverage.run]
branch = true
source = ["docs_viewer/"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]
